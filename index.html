<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Taskly — To-Do List</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e5e9f2;--primary:#4f46e5;--shadow:0 12px 35px #17203312}
[data-theme=dark]{color-scheme:dark;--bg:#0d1220;--card:#151c2d;--text:#edf2ff;--muted:#a2aec5;--line:#2b3650;--primary:#818cf8;--shadow:0 12px 35px #0004}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;transition:.2s}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1000px;margin:auto;padding:28px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--primary);color:white;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;font-size:24px;font-weight:900}.brand h1{margin:0;font-size:1.4rem}.brand p{margin:0;color:var(--muted);font-size:.9rem}.btn,.icon,.field input,.field select,.search,.filter{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 13px}.icon{width:44px;height:44px;font-size:19px}.hero{padding:26px 28px;border-radius:22px;color:white;background:linear-gradient(120deg,#4f46e5,#8178fa);margin-bottom:20px}.hero h2{margin:0 0 5px;font-size:clamp(1.5rem,4vw,2rem)}.hero p{margin:0;color:#e8e7ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:20px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:17px}.stat label{color:var(--muted);font-size:.88rem}.stat strong{display:block;font-size:2rem}.panel{padding:21px;margin-bottom:20px}.panel h2{margin:0 0 16px;font-size:1.1rem}.grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:.8rem;color:var(--muted);font-weight:650}.field input,.field select{width:100%;min-width:0;background:var(--bg)}.form-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--primary);color:#fff;border:0;border-radius:11px;padding:11px 16px;font-weight:750}.muted{color:var(--muted);font-size:.83rem}.cancel{display:none}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0}.filters{display:flex;gap:8px;flex:1;justify-content:flex-end;flex-wrap:wrap}.search{flex:1;min-width:160px;max-width:260px}.filter{padding:10px;max-width:100%}.tasks{display:grid;gap:10px;margin-top:16px}.task{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:13px}.task input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:#16a34a;flex-shrink:0}.taskbody{flex:1;min-width:0}.taskname{font-weight:750;overflow-wrap:anywhere}.done .taskname{text-decoration:line-through;color:var(--muted)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:.73rem;border:1px solid var(--line);border-radius:99px;padding:3px 8px;color:var(--muted)}.high{color:#dc2626}.medium{color:#b45309}.low{color:#15803d}.overdue{color:#dc2626!important}.actions{display:flex;gap:4px}.small{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 9px;font-size:17px}.small:hover{background:var(--bg);color:var(--text)}.empty{text-align:center;padding:36px 12px;color:var(--muted)}.empty strong{display:block;color:var(--text)}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:.84rem}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--text);color:var(--card);padding:10px 15px;border-radius:10px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.field:first-child{grid-column:1/-1}.panel{padding:15px}.filters{justify-content:flex-start}.search{max-width:none}.toolbar{align-items:flex-start}}@media(max-width:460px){.app{padding:18px 12px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:1.6rem}.stat label{font-size:.78rem}.grid{grid-template-columns:1fr}.field:first-child{grid-column:auto}.hero{padding:22px}.task{padding:11px}.actions{flex-direction:column}.filters{width:100%}.search{min-width:100%}.filter{flex:1}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Taskly</h1><p>Your day, organized.</p></div></div><button class="icon" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button></header>
<section class="hero"><h2>Make today count.</h2><p>A little progress every day adds up. What's on your list?</p></section>
<section class="stats" aria-label="Task statistics"><div class="stat"><label>Total tasks</label><strong id="total">0</strong></div><div class="stat"><label>Completed</label><strong id="completed">0</strong></div><div class="stat"><label>Pending</label><strong id="pending">0</strong></div></section>
<section class="panel"><h2 id="formTitle">＋ Add a new task</h2><form id="form"><div class="grid">
<div class="field"><label for="title">Task title *</label><input id="title" maxlength="120" required placeholder="e.g. Finish assignment"></div>
<div class="field"><label for="category">Category</label><select id="category"><option>Personal</option><option>Work</option><option>Study</option><option>Health</option><option>Shopping</option><option>Other</option></select></div>
<div class="field"><label for="priority">Priority</label><select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
<div class="field"><label for="due">Due date</label><input type="date" id="due"></div>
</div><div class="form-actions"><button class="primary" id="submit" type="submit">＋ Add task</button><button class="btn cancel" id="cancel" type="button">Cancel edit</button><span class="muted">Saved automatically on this device.</span></div></form></section>
<section class="panel"><div class="toolbar"><h2>Your tasks</h2><div class="filters"><input class="search" id="search" type="search" placeholder="⌕ Search tasks..." aria-label="Search tasks"><select class="filter" id="status" aria-label="Filter by status"><option value="all">All statuses</option><option value="pending">Pending</option><option value="completed">Completed</option></select><select class="filter" id="catFilter" aria-label="Filter by category"><option value="all">All categories</option><option>Personal</option><option>Work</option><option>Study</option><option>Health</option><option>Shopping</option><option>Other</option></select><select class="filter" id="sort" aria-label="Sort tasks"><option value="new">Newest</option><option value="due">Due date</option><option value="priority">Priority</option><option value="title">Title A–Z</option></select></div></div><div class="tasks" id="tasks"></div><div class="footer"><span id="shown">Showing 0 tasks</span><button class="btn" id="clear" type="button">Clear completed</button></div></section>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var KEY='taskly.tasks.v1',THEME='taskly.theme',tasks=[],editing=null,timer;
function $(id){return document.getElementById(id)}
function escapeHTML(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(function(){$('toast').classList.remove('show')},2300)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){toast('Could not save: browser storage is unavailable.')}}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(v)?v.filter(function(t){return t&&typeof t.id==='string'&&typeof t.title==='string'}):[]}catch(e){tasks=[]}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function overdue(t){return t.due&&t.due<today()&&!t.done}
function visible(){var q=$('search').value.trim().toLowerCase(),st=$('status').value,cat=$('catFilter').value,sort=$('sort').value;var a=tasks.filter(function(t){return (!q||(t.title+' '+t.category+' '+t.priority+' '+(t.due||'')).toLowerCase().includes(q))&&(st==='all'||(st==='completed'?t.done:!t.done))&&(cat==='all'||t.category===cat)});var rank={high:0,medium:1,low:2};a.sort(function(x,y){if(sort==='due')return (x.due||'9999-12-31').localeCompare(y.due||'9999-12-31');if(sort==='priority')return rank[x.priority]-rank[y.priority];if(sort==='title')return x.title.localeCompare(y.title);return y.created-x.created});return a}
function render(){var c=tasks.filter(function(t){return t.done}).length;$('total').textContent=tasks.length;$('completed').textContent=c;$('pending').textContent=tasks.length-c;var a=visible();$('shown').textContent='Showing '+a.length+' of '+tasks.length+' tasks';if(!a.length){var filtered=$('search').value||$('status').value!=='all'||$('catFilter').value!=='all';$('tasks').innerHTML='<div class="empty"><strong>'+(filtered?'No matching tasks':'Your list is clear')+'</strong>'+(filtered?'Try changing your search or filters.':'Add a task above to get started.')+'</div>';return}
$('tasks').innerHTML=a.map(function(t){return '<article class="task '+(t.done?'done':'')+'" data-id="'+escapeHTML(t.id)+'"><input type="checkbox" data-action="toggle" aria-label="Toggle task" '+(t.done?'checked':'')+'><div class="taskbody"><div class="taskname">'+escapeHTML(t.title)+'</div><div class="meta"><span class="pill">'+escapeHTML(t.category)+'</span><span class="pill '+escapeHTML(t.priority)+'">'+escapeHTML(t.priority.charAt(0).toUpperCase()+t.priority.slice(1))+' priority</span>'+(t.due?'<span class="pill '+(overdue(t)?'overdue':'')+'">'+(overdue(t)?'Overdue · ':'Due · ')+escapeHTML(fmt(t.due))+'</span>':'')+'</div></div><div class="actions"><button class="small" data-action="edit" aria-label="Edit task" title="Edit">✎</button><button class="small" data-action="delete" aria-label="Delete task" title="Delete">×</button></div></article>'}).join('')}
function reset(){ $('form').reset();$('priority').value='medium';editing=null;$('formTitle').textContent='＋ Add a new task';$('submit').textContent='＋ Add task';$('cancel').style.display='none'}
$('form').addEventListener('submit',function(e){e.preventDefault();var title=$('title').value.trim();if(!title){$('title').setCustomValidity('Please enter a task title.');$('title').reportValidity();$('title').setCustomValidity('');return}var data={title:title,category:$('category').value,priority:$('priority').value,due:$('due').value};if(editing){var t=tasks.find(function(x){return x.id===editing});if(!t){reset();return}Object.assign(t,data,{updated:Date.now()});toast('Task updated.')}else{tasks.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2),done:false,created:Date.now()},data));toast('Task added.')}save();reset();render()});
$('cancel').addEventListener('click',reset);
$('tasks').addEventListener('change',function(e){if(e.target.dataset.action!=='toggle')return;var el=e.target.closest('[data-id]'),t=tasks.find(function(x){return x.id===el.dataset.id});if(!t)return;t.done=e.target.checked;save();render();toast(t.done?'Task completed.':'Task marked pending.')});
$('tasks').addEventListener('click',function(e){var b=e.target.closest('button[data-action]');if(!b)return;var el=b.closest('[data-id]'),t=tasks.find(function(x){return x.id===el.dataset.id});if(!t)return;if(b.dataset.action==='edit'){editing=t.id;$('title').value=t.title;$('category').value=t.category;$('priority').value=t.priority;$('due').value=t.due||'';$('formTitle').textContent='✎ Edit task';$('submit').textContent='Save changes';$('cancel').style.display='inline-flex';$('title').focus();window.scrollTo({top:0,behavior:'smooth'})}else if(b.dataset.action==='delete'&&confirm('Delete "'+t.title+'"?')){tasks=tasks.filter(function(x){return x.id!==t.id});if(editing===t.id)reset();save();render();toast('Task deleted.')}});
['search','status','catFilter','sort'].forEach(function(id){$(id).addEventListener(id==='search'?'input':'change',render)});
$('clear').addEventListener('click',function(){var n=tasks.filter(function(t){return t.done}).length;if(!n){toast('There are no completed tasks to clear.');return}if(!confirm('Delete all '+n+' completed tasks?'))return;tasks=tasks.filter(function(t){return !t.done});if(editing&&!tasks.some(function(t){return t.id===editing}))reset();save();render();toast('Completed tasks cleared.')});
function theme(v){document.documentElement.dataset.theme=v;$('theme').textContent=v==='dark'?'☀':'☾';$('theme').setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem(THEME,v)}catch(e){}}
var saved='light';try{saved=localStorage.getItem(THEME)||'light'}catch(e){}theme(saved==='dark'?'dark':'light');$('theme').addEventListener('click',function(){theme(document.documentElement.dataset.theme==='dark'?'light':'dark')});load();render()
})();
</script>
</body>
</html>
